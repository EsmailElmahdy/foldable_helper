name: foldable_device
description: "Foldable posture, hinge angle and hinge orientation for Android foldables and iPhone Duo (iOS 27.1+), over one EventChannel."
version: 0.1.0
repository: https://github.com/esmailelmahdy-debug/foldable_helper
publish_to: none

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.booktime.foldable_device
        pluginClass: FoldableDevicePlugin
      ios:
        pluginClass: FoldableDevicePlugin
