name: foldable_device
description: "Foldable posture, hinge angle, fold direction and reserved regions (fold, camera) for Android foldables and the iPhone Duo (iOS 27.1+)."
version: 0.1.1
repository: https://github.com/EsmailElmahdy/foldable_helper
issue_tracker: https://github.com/EsmailElmahdy/foldable_helper/issues
topics:
  - foldable
  - hinge
  - dual-screen
  - iphone
  - layout

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.booktime.foldable_device
        pluginClass: FoldableDevicePlugin
      ios:
        pluginClass: FoldableDevicePlugin
